# Harness v4 Configuration
# Edit this file, then run `harness sync` to generate CC plugin files.
# NOTE: the rebuilt binary's sync (2026-07-07, v4.16.4+patches) preserves unknown plugin.json fields (displayName/defaultEnabled) and no longer creates .claude-plugin/hooks.json. Sync OWNS name/version/description/author/homepage/repository/license/keywords/skills/outputStyles — keep this [project] section aligned with the curated plugin.json before running 'harness sync'.

[project]
name = "chanpark-harness"
version = "1.3.6"
description = "Personal multi-agent harness for Claude Code. claude-code-harness base (plan-work-review cycle, pre-built Go binary) merged with selected oh-my-claudecode consult agents and skills, modernized for the current Claude Code plugin spec."
homepage = "https://github.com/chanp5660/chanpark-harness"
repository = "https://github.com/chanp5660/chanpark-harness"
license = "MIT"
keywords = ["claude-code", "plugin", "multi-agent", "harness", "plan-work-review", "orchestration"]
outputStyles = "./output-styles/"

[project.author]
name = "ChanPark"
# The binary's sync emits only name/url here — an `email` key is read but never
# written to plugin.json, so keeping one would be inert config that silently
# loses the value on the next sync.
url = "https://github.com/chanp5660"

[env]
CLAUDE_CODE_SUBPROCESS_ENV_SCRUB = "1"

[safety.permissions]
# Handling of direct pushes to main/master.
# ask: confirm with the user before running (default) / deny: forbid / allow: permit without confirmation
protectedBranchPush = "ask"
allow = [
  # Low-risk local development commands. Keep install, arbitrary npx/npm exec,
  # merge/rebase, destructive git, secrets, and external sends behind ask/deny.
  "Bash(git status:*)",
  "Bash(git diff:*)",
  "Bash(git log:*)",
  "Bash(git branch:*)",
  "Bash(git show:*)",
  "Bash(rg:*)",
  "Bash(npm test:*)",
  "Bash(npm run test:*)",
  "Bash(npm run lint:*)",
  "Bash(npm run build:*)",
  "Bash(bun test:*)",
  "Bash(bun run test:*)",
  "Bash(bun run lint:*)",
  "Bash(bun run build:*)",
  "Bash(pnpm test:*)",
  "Bash(pnpm run test:*)",
  "Bash(pnpm run lint:*)",
  "Bash(pnpm run build:*)",
  "Bash(yarn test:*)",
  "Bash(yarn run test:*)",
  "Bash(yarn run lint:*)",
  "Bash(yarn run build:*)",
]
deny = [
  "Bash(sudo:*)",
  "Bash(rm -rf:*)",
  "Bash(rm -fr:*)",
  "Bash(psql:*)",
  "Bash(mysql:*)",
  "Bash(mongod:*)",
  "Bash(mongo:*)",
  "mcp__codex__*",
  # Self-modification guard: forbid Write/Edit to settings files (CLAUDE.md Permission Boundaries).
  # 'harness sync' generates .claude-plugin/settings.json; do not edit it directly.
  "Edit(.claude/settings*)",
  "Write(.claude/settings*)",
  "Edit(.claude-plugin/settings*)",
  "Write(.claude-plugin/settings*)",
  "Read(./.env)",
  "Read(./.env.*)",
  "Read(./secrets/**)",
  "Read(**/*.pem)",
  "Read(**/*.key)",
  "Read(**/*id_rsa*)",
  "Read(**/*id_ed25519*)",
  "Read(**/.aws/**)",
  "Read(**/.ssh/**)",
  "Read(**/.npmrc)",
]
ask = [
  "Bash(rm -r:*)",
  "Bash(git reset --hard:*)",
  "Bash(git push -f:*)",
  "Bash(git push --force:*)",
  "Bash(git push --force-with-lease:*)",
  "Bash(git clean -f:*)",
  "Bash(git clean -fdx:*)",
  "Bash(git clean -fx:*)",
  "Bash(git rebase:*)",
  "Bash(git merge:*)",
  "Bash(npm install:*)",
  "Bash(npm exec:*)",
  "Bash(npx:*)",
  "Bash(bun install:*)",
  "Bash(pnpm install:*)",
]

# Optional R03 break-glass: shell writes to exact/narrow .env paths ask instead
# of deny only when this TOML entry has a non-empty reason. R02 Write/Edit/
# MultiEdit and hard-deny paths (.git/, secrets/, *.pem, *.key, SSH trust,
# shell rc/profile, .claude/hooks, .husky) remain denied.
# [[safety.guardrail.protectedPathAskList]]
# path = ".env"
# reason = "customer deploy env update"

[safety.sandbox]
failIfUnavailable = true

[safety.sandbox.network]
# SSOT for .claude-plugin/settings.json deniedDomains. Phase 62.1.4 baseline:
# 3 cloud-metadata exfil endpoints + 6 paste-site/file-host endpoints.
# Keep this aligned with templates/claude/settings.security.json.template.
# Editing settings.json directly is denied by self-protection — update HERE
# and run `bin/harness sync` to regenerate.
deniedDomains = [
  "169.254.169.254",
  "metadata.google.internal",
  "metadata.azure.com",
  "pastebin.com",
  "transfer.sh",
  "0x0.st",
  "paste.ee",
  "termbin.com",
  "ix.io",
]

[safety.sandbox.filesystem]
denyRead = [
  ".env",
  ".env.*",
  "!.env.example",
  "secrets/**",
  "**/*.pem",
  "**/*.key",
  "**/*id_rsa*",
  "**/*id_ed25519*",
  "**/.aws/**",
  "**/.ssh/**",
]
allowRead = [
  ".env.example",
  ".env.sample",
  "config/public-*",
  "docs/**",
]

# Plans.md lifecycle. Read by scripts/plans-sweep.sh and reported by
# scripts/hook-handlers/session-monitor.sh. The vendored binary does not read this
# section; it is shell-side configuration only.
[plans]
# Threshold provenance (docs/design/plans-redesign.md §2.3): the measured maximum
# legitimate dwell from cc:todo to cc:done in this repository is 4.129 days; a x2
# engineering safety factor gives 8.26 days; rounded up to the weekly boundary a human
# actually reviews gives 14. Replayed over all 20 historical rows, 14 days retires
# zero of them. The claim is "provably destroys nothing observed", not "fitted" —
# the observed abandonment rate is 0/20, so there is no distribution to fit.
stale_days = 14                          # T1: cc:todo / cc:blocked untouched this long
archive_days = 14                        # T2: PER-ROW. A terminal row (cc:done /
                                         # cc:dropped) untouched this long is an archive
                                         # candidate on its own. It is NOT a condition on
                                         # the whole file: gating the archive on "every
                                         # row is terminal" let one perpetually-open
                                         # cc:todo suppress archiving forever, which is
                                         # the unbounded-growth failure this section
                                         # exists to prevent. Linear's own rule is
                                         # per-issue, not per-view.

# Plans-backlog.md staleness (T3). Derivation (docs/design/plans-redesign.md §2.2):
# there is no measured abandonment distribution for captured ideas either, so this is
# bounded, not fitted. Shape Up's betting cycle is 6 weeks; an idea that survives two
# full cycles (84 days) without ever being pitched has failed the only selection process
# the backlog has. Rounded to the quarter boundary a human actually reviews: 90 days.
# Report only — like every other trigger here, it never edits the file.
backlog_stale_days = 90

# T1 ships OFF: zero observed abandonments means zero evidence for the threshold.
# T2 ships ON: it is a pure function of per-row state and time, both directly
# observable via git blame.
# T3 ships ON: it reads a capture date the format already requires, so it needs no
# fitted threshold to be correct — it reports an age, and 90 days only decides when the
# age is worth printing.
# All three only ever PRINT candidates — nothing in this repo rewrites a marker or a
# bullet on a timer. A markdown file has no activity feed and no undo, so a silent
# retirement is invisible until someone reads a diff.
stale_sweep_enabled = false
archive_sweep_enabled = true
backlog_sweep_enabled = true

# Active-row caps (todo + wip + blocked; terminal rows awaiting archive do not count,
# or the cap would fight the archive sweep). Weakly derived and deliberately marked as
# such: the largest plan this repo ever carried to completion was 20 rows, so
# soft = 20 x 1.25 and hard = soft + 20%. Overflow fails toward Plans-backlog.md,
# which is recoverable, never toward unbounded growth, which is not.
soft_cap = 25                            # warn, and route new items to the backlog
hard_cap = 30                            # refuse to add to Plans.md at all
wip_cap = 1                              # one active bet; wip-guard already enforces it

# Length budget for the ACTIVE file, in lines, including its boilerplate.
# A row cap alone does not bound the file: 30 rows plus the legend and format notes the
# file used to carry measured 93 lines, already unreadable in one screen. The two are
# reconciled by shrinking the boilerplate, not the row cap — the long-form legend and
# format rules moved to skills/harness-plan/references/plans-format.md, leaving
# ~20 lines of header so that 30 rows still lands inside the budget.
#
# 80 = the conventional one-screen height (80x24 is 24 rows, but an editor viewport at a
# normal font shows ~80 lines of markdown; it is also the line length every style guide
# in this repo already uses, so it is the number a reader here already has calibrated).
# This is a REPORTED budget, not admission control: a write is never refused because a
# description is well written. §2.5 rejects a byte/line cap as the gate for exactly that
# reason, and that rejection stands. Overflow behaviour:
#   <= max_lines      normal.
#   >  max_lines      session-monitor and the plans-watcher hook both print an over-budget
#                     notice naming the excess; run the archive sweep and move terminal
#                     rows out. In THIS repository CI additionally fails
#                     (check-regression-guard.sh: plans-line-budget), because the repo's
#                     own Plans.md is the worked example the design is pinned to.
max_lines = 80

[tdd]
adopt_todo_list_first = true
adopt_triangulation = "guide-only"
adopt_fake_implementation = false

[tdd.enforce]
# Local trial safe default: no behavior changes until explicitly enabled.
enabled = false
level = "off"                            # "off" | "central" | "max"
hook_enabled = false                     # Only fires when level == "max".
default_max_red_log_age_minutes = 60
bypass_audit_required = true

# Rule set the Worker self-verifies before commit. The Worker fills each entry of
# `worker-report.v1` self_review[] with {rule, verified: true, evidence: "<actual command output>"}
# and returns it. If even one rule has verified=false or evidence="", Lead
# auto-returns it to the Worker without spawning the Reviewer (max 2 times per session; escalate on the 3rd).
# To add project-specific rules, append to the `extra_rules` array (independent of the default 6).
# `tdd-red-evidence-attached` is enabled only when [tdd.enforce].enabled = true.
[worker.self_review]
default_rules = [
  "dry-violation-none",                  # zero DRY violations (shared implementation and imports)
  "plans-cc-markers-untouched",          # Plans.md cc:* markers untouched
  "all-declared-symbols-called",         # every declared function/class has a call path
  "dod-items-verified-with-evidence",    # each DoD item has a verification method and evidence
  "no-existing-test-regression",         # no regression in existing tests
  "tdd-red-evidence-attached",           # active only when [tdd.enforce].enabled = true
]
extra_rules = []                         # list project-specific rules here
max_retries_before_escalate = 2          # escalate to Lead on the 3rd return
